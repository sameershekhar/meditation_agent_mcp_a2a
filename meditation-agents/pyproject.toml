[project]
name = "meditation-agent"
version = "0.1.0"
description = "LangGraph meditation agent using a remote MCP preference server and Gemini"
requires-python = ">=3.14"

dependencies = [
    "a2a-sdk>=1.2.1",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "langgraph>=0.6",
    "langsmith>=0.14.1",
    "mcp>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34",
]
